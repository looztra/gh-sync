[tools]
"github:editorconfig-checker/editorconfig-checker" = "4"
"go:golang.org/x/tools/cmd/deadcode" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
golangci-lint = "2.14"
prek = "0.4"
shellcheck = "0.11"
shfmt = "3"
taplo = "0.10"

[settings]
idiomatic_version_file_enable_tools = [
  "go",
]

[task_config]
includes = [
  "toolbox/mise/tasks/toml/*.toml",
]
