---
on:
  push:
    branches:
      - main

permissions: {}

name: Manage releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create tags and GitHub releases.
      pull-requests: write # Required to open and update the release PR.
    steps:
      # A PAT is required: tags/releases created with GITHUB_TOKEN do not
      # trigger the tag-based `release` workflow that builds the binaries.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
