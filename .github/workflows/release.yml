name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish the release artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          # The action runs `go build -ldflags="-s -w"` and then appends this value; the
          # last -ldflags wins, so `-s -w` must be repeated here. The next step guards this.
          go_build_options: "-ldflags=-s -w -X github.com/wassimk/gh-sync/internal/version.Tag=${{ github.ref_name }}"
      - name: Verify release binary version
        run: |
          out="$(./dist/linux-amd64 --version)"
          echo "$out"
          case "$out" in
            "gh-sync ${GITHUB_REF_NAME} ("*-dirty\)*) echo "binary is stamped dirty" >&2; exit 1 ;;
            "gh-sync ${GITHUB_REF_NAME} ("*) ;;
            *) echo "binary does not report tag ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
